<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honcho control</title>
<style>
:root {
  --bg:#ECEEF0; --pane:#F3F4F6; --page:#FFFFFF; --ink:#1B2227; --muted:#66717B; --faint:#97A1AA; --line:#CDD3D9;
  --soft:#E3E7EA; --hover:#F1F3F5; --head:#EEF0F2; --accent:#0C6C76; --accent-bg:#DDEFF1; --on-accent:#FFFFFF;
  --amber:#A05E00; --amber-edge:#DE9A1F; --amber-bg:#FBF0DA; --ok:#2A7D50; --bad:#B3342B; --bad-bg:#F9E3E1; --add:#E0F3E6; --del:#FAE4E2;
  --sans:"Segoe UI Variable Text","Segoe UI","Helvetica Neue",Arial,sans-serif; --mono:"Cascadia Mono","Cascadia Code",Consolas,Menlo,monospace;
}
:root[data-theme="dark"] {
  --bg:#13171A; --pane:#181D21; --page:#1D2327; --ink:#DBE1E5; --muted:#8E99A3; --faint:#65727C; --line:#3A444C;
  --soft:#2B343A; --hover:#242B30; --head:#222A2F; --accent:#62C6D1; --accent-bg:#17373C; --on-accent:#082125;
  --amber:#E8AE55; --amber-edge:#D4952F; --amber-bg:#372B13; --ok:#63C58B; --bad:#EF8C84; --bad-bg:#42211F; --add:#1B3625; --del:#41201E;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.45 var(--sans); }
header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; padding:8px 14px; background:var(--pane); border-bottom:1px solid var(--line); }
header .brand { font-weight:700; font-size:14px; }
header .grow { flex:1; }
.layout { display:flex; min-height:calc(100vh - 76px); }
nav { width:150px; flex:none; padding:12px 8px; background:var(--pane); border-right:1px solid var(--line); }
nav a { display:block; padding:6px 10px; margin-bottom:2px; border-radius:5px; color:var(--ink); text-decoration:none; white-space:nowrap; }
nav a:hover { background:var(--hover); }
nav a.on { background:var(--accent-bg); color:var(--accent); font-weight:600; }
main { flex:1; min-width:0; padding:16px 20px 70px; max-width:1180px; }
h1 { font-size:20px; font-weight:600; margin:0 0 4px; }
.lead { color:var(--muted); margin:0 0 14px; }
.box { background:var(--page); border:1px solid var(--line); border-radius:6px; margin-bottom:14px; }
.box > h2 { font-size:15px; font-weight:600; margin:0; padding:10px 14px; border-bottom:1px solid var(--soft); }
.box > .in { padding:12px 14px; }
.hint { color:var(--muted); font-size:12px; }
.warn { background:var(--amber-bg); border:1px solid var(--amber-edge); border-radius:5px; padding:8px 10px; margin:8px 0; }
.err { background:var(--bad-bg); border:1px solid var(--bad); border-radius:5px; padding:8px 10px; margin:8px 0; }
.tw { overflow-x:auto; }
table { border-collapse:collapse; width:100%; }
th { text-align:left; font-size:12px; font-weight:600; color:var(--muted); background:var(--head); padding:5px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
td { padding:3px 4px; border-bottom:1px solid var(--soft); vertical-align:middle; }
td.name { white-space:nowrap; }
tr.defaults td { background:var(--pane); font-weight:600; }
tr.off td.name, tr.off td.name button { color:var(--faint); }
button { font:inherit; height:28px; padding:0 12px; border:1px solid var(--line); border-radius:5px; background:var(--page); color:var(--ink); cursor:pointer; white-space:nowrap; }
button:hover { background:var(--hover); }
button.pri { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
button.has { background:var(--amber-bg); border-color:var(--amber-edge); font-weight:600; }
button.lnk { border:0; background:none; color:var(--accent); padding:0 4px; height:auto; }
button.name { border:0; background:none; padding:0; height:auto; font-weight:600; color:var(--ink); }
button.name:hover { color:var(--accent); }
button:disabled { opacity:.5; cursor:default; }
select, input[type=text], input[type=number] { font:inherit; height:28px; border:1px solid var(--line); border-radius:4px; background:var(--page); color:var(--ink); padding:0 6px; max-width:100%; }
select:focus, input:focus, textarea:focus { outline:none; border-color:var(--accent); }
select.inherit { color:var(--muted); font-style:italic; }
select.changed, button.changed, input.changed { border-color:var(--amber-edge) !important; background:var(--amber-bg) !important; }
input.inherit::placeholder { color:var(--muted); font-style:italic; }
.stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.stat { border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:var(--page); }
.stat .k { color:var(--muted); font-size:12px; } .stat .v { font-size:18px; font-weight:600; }
button.pick { width:140px; height:26px; font-size:12px; text-align:left; overflow:hidden; text-overflow:ellipsis; padding:0 6px; }
button.pick.inherit { color:var(--muted); font-style:italic; }
option { color:var(--ink); background:var(--page); font-style:normal; }
textarea { font:12.5px/1.5 var(--mono); width:100%; border:1px solid var(--line); border-radius:4px; background:var(--page); color:var(--ink); padding:8px; resize:vertical; }
textarea:disabled { color:var(--faint); background:var(--pane); }
pre.log { font:12px/1.45 var(--mono); background:var(--pane); border:1px solid var(--line); border-radius:4px; padding:8px; height:380px; overflow:auto; margin:0; white-space:pre-wrap; word-break:break-word; }
pre.log.prompt { height:auto; max-height:60vh; }
pre.log.prompt mark { background:var(--amber-bg); outline:1px solid var(--amber-edge); color:inherit; }
.row { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:end; }
.row label { display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
.switch { display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; white-space:nowrap; }
.switch input { display:none; }
.switch .track { width:32px; height:18px; border-radius:9px; background:var(--faint); position:relative; transition:.15s; flex:none; }
.switch .track::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:.15s; }
.switch input:checked + .track { background:var(--ok); }
.switch input:checked + .track::after { left:16px; }
.switch .txt { font-size:12px; min-width:58px; }
td .switch .txt { min-width:24px; }
td select, td input[type=number] { font-size:12px; height:26px; padding:0 4px; }
.box > .in.tw { padding:8px; }
.switch.busy { opacity:.5; pointer-events:none; }
.jobs { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
.job { border:1px solid var(--line); border-radius:6px; padding:12px; background:var(--page); }
.job .name { font-weight:600; font-size:14px; }
.job .what { color:var(--muted); font-size:12px; min-height:34px; }
.state { font-size:18px; font-weight:700; margin:6px 0 2px; }
.state.on { color:var(--ok); } .state.off { color:var(--bad); }
.job .why { font-size:12px; color:var(--muted); min-height:18px; }
.job button { margin-top:8px; }
.modes { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; }
.mode { border:1px solid var(--line); border-radius:6px; padding:10px 12px; cursor:pointer; display:block; }
.mode.on { border-color:var(--accent); background:var(--accent-bg); }
.tabs { display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap; }
.tabs button.on { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); font-weight:600; }
.bulk { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 10px; margin-bottom:8px; background:var(--pane); border:1px solid var(--line); border-radius:5px; }
.levels { display:flex; flex-wrap:wrap; gap:6px 12px; }
.levels label { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); }
footer { position:fixed; bottom:0; left:0; right:0; display:flex; gap:12px; align-items:center; padding:6px 14px; background:var(--pane); border-top:1px solid var(--line); font-size:12px; color:var(--muted); z-index:4; }
footer .grow { flex:1; }
.ok { color:var(--ok); } .bad { color:var(--bad); }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:flex-start; justify-content:center; padding:50px 12px; z-index:10; }
.modal.show { display:flex; }
.modal .panel { background:var(--page); border:1px solid var(--line); border-radius:6px; width:min(820px,100%); max-height:80vh; overflow:auto; padding:14px; position:relative; }
.modal .x { position:absolute; top:8px; right:8px; }
.diff td { font-family:var(--mono); font-size:12px; word-break:break-word; }
.diff td.b { background:var(--del); } .diff td.a { background:var(--add); }
.mono { font-family:var(--mono); }
details > summary { cursor:pointer; color:var(--accent); margin:8px 0; }
@media (max-width:1100px) {
  .layout { display:block; }
  nav { width:auto; display:flex; overflow-x:auto; padding:6px; border-right:0; border-bottom:1px solid var(--line); }
  nav a { flex:none; }
  main { padding:12px 12px 70px; }
}
</style>
</head>
<body>
<header>
  <span class="brand">honcho-tools</span>
  <span class="grow"></span>
  <button id="review-btn" onclick="openReview()">Review (0)</button>
  <button id="discard-btn" onclick="discardAll()" hidden>Discard</button>
  <button id="theme-btn" onclick="toggleTheme()">Dark</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="modal" id="modal"><div class="panel" id="modal-panel"></div></div>
<footer><span id="health">…</span><span class="grow"></span><span id="read-at"></span><button onclick="loadAll()">Refresh</button></footer>
<script>
"use strict";
const PAGES = [["overview", "Overview"], ["models", "Models"], ["honcho", "Honcho config"], ["peers", "Peers"], ["pairs", "Pairs"], ["rerank", "Rerank"], ["runs", "Runs"], ["cost", "Cost"], ["instructions", "Instructions"], ["logs", "Logs"], ["advanced", "Advanced"]];
const EFFORTS = ["none", "minimal", "low", "medium", "high", "xhigh", "max"];
const effortOption = (e) => ({ value: e, label: e === "none" ? "none (thinking off)" : e });
const BRIEFS = [50, 100, 150, 200, 250, 300, 350, 400, 450, 500];
const ROUNDS = [4, 8, 10, 12, 16, 20, 24, 32, 40, 50];
const LEVELS = ["minimal", "low", "medium", "high", "max"];
const S = {
  settings0: null, settings: null, mtime: null, control: null, honcho: null, hIndex: {}, hEdits: {},
  ws: { enabled: {}, instructions: {} }, instr: {}, catalogue: { dream: [], tasks: {}, backends: {} }, runtime: {},
  peersApi: { discovered: [] }, status: null, containers: null, history: null, instructions: null,
  page: "overview", instrTab: "dream", editor: null, selected: { peers: new Set(), pairs: new Set() }, notice: "", bulk: {},
  promptMode: {}, busy: false,
};

// ---------- helpers ----------
function h(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "class") node.className = value;
    else if (key === "value") node.value = value;
    else if (key === "checked") node.checked = !!value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const kid of kids.flat(5)) if (kid !== null && kid !== undefined && kid !== false) node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return node;
}
const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
async function api(path, body) {
  const options = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const response = await fetch(path, options);
  const text = await response.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = { detail: text }; }
  if (!response.ok) { const d = data && data.detail; throw new Error(Array.isArray(d) ? d.join("; ") : (d || response.status + " " + response.statusText)); }
  return data;
}
function when(value) {
  if (!value) return "—";
  const d = new Date(value);
  if (isNaN(d)) return String(value).replace(/\.\d+/, "").replace("T", " ").replace("Z", "");
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
// For pages that say their times are UTC: the browser's own zone must not shift them.
function whenUtc(value) {
  if (!value) return "—";
  const d = new Date(value);
  if (isNaN(d)) return String(value).replace(/\.\d+/, "").replace("T", " ").replace("Z", "");
  return d.toISOString().slice(0, 19).replace("T", " ");
}
function note(text, bad) { S.notice = text ? { text, bad } : ""; render(); }
function getPath(o, path) { return path.split(".").reduce((n, k) => (n == null ? undefined : n[k]), o); }
function setPath(o, path, value) {
  const keys = path.split(".");
  let n = o;
  for (const k of keys.slice(0, -1)) { if (n[k] == null || typeof n[k] !== "object") n[k] = {}; n = n[k]; }
  if (value === undefined) delete n[keys[keys.length - 1]]; else n[keys[keys.length - 1]] = value;
}
// A switch that writes at once: onchange returns a promise; the switch is disabled while it runs.
function sw(checked, onText, offText, onchange, disabled) {
  const label = h("label", { class: "switch" });
  const input = h("input", { type: "checkbox", checked, disabled, onchange: async (e) => {
    label.classList.add("busy");
    try { await onchange(e.target.checked); } finally { label.classList.remove("busy"); }
  } });
  label.append(input, h("span", { class: "track" }), h("span", { class: "txt" }, checked ? onText : offText));
  return label;
}
function choice(options, value, onchange, attrs) {
  const select = h("select", Object.assign({ onchange: (e) => onchange(e.target.value) }, attrs || {}));
  for (const o of options) {
    if (o.group) select.append(h("optgroup", { label: o.group }, o.items.map((i) => h("option", { value: i.value }, i.label))));
    else select.append(h("option", { value: o.value }, o.label));
  }
  const wanted = value == null ? "" : String(value);
  select.value = wanted;
  if (select.value !== wanted) { select.prepend(h("option", { value: wanted }, wanted + " (current)")); select.value = wanted; }
  if (select.value === "") select.classList.add("inherit");
  return select;
}
// Numbers: the empty choice shows where the value comes from ("350 · default"); "Other number…" swaps in an input.
function numberChoice(list, value, inheritLabel, onchange, width) {
  const options = [{ value: "", label: inheritLabel }].concat(list.map((n) => ({ value: String(n), label: String(n) })), [{ value: "__custom", label: "Other number…" }]);
  const select = choice(options, value == null ? "" : value, (picked) => {
    if (picked !== "__custom") return onchange(picked === "" ? null : Number(picked));
    const input = h("input", { type: "number", min: 1, max: 1000, style: "width:" + width + "px", onchange: (e) => { const n = Number(e.target.value); if (n > 0) onchange(n); } });
    select.replaceWith(input); input.focus();
  }, { style: "width:" + width + "px" });
  return select;
}

// ---------- changes waiting for Review ----------
function settingsChanges() {
  const out = [];
  const walk = (a, b, path) => {
    if (same(a, b)) return;
    const oa = a && typeof a === "object" && !Array.isArray(a), ob = b && typeof b === "object" && !Array.isArray(b);
    if (oa && ob) { for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) walk(a[k], b[k], path ? path + "." + k : k); return; }
    out.push({ path, before: a, after: b });
  };
  walk(S.settings0 || {}, S.settings || {}, "");
  return out;
}
function undoSettings(path) {
  const keys = path.split(".");
  const original = getPath(S.settings0, path);
  if (original === undefined) { const parent = keys.length > 1 ? getPath(S.settings, keys.slice(0, -1).join(".")) : S.settings; if (parent) delete parent[keys[keys.length - 1]]; }
  else setPath(S.settings, path, clone(original));
}
function changeList() {
  const groups = [];
  const settings = settingsChanges();
  if (settings.length) groups.push({ file: "Dream settings", items: settings.map((c) => ({ label: plainPath(c.path), before: plainValue(c.path, c.before), after: plainValue(c.path, c.after), undo: () => undoSettings(c.path) })) });
  const ws = Object.entries(S.ws.instructions).map(([kind, item]) => ({ label: (PROMPT_JOBS[kind] || kind) + " prompt", before: "",
    after: item.unset ? (sharedText() ? "Honcho's prompt + shared workspace text" : "Honcho's prompt only") : item.text ? "Honcho's prompt + my text: " + item.text : "Honcho's prompt only",
    undo: () => { delete S.ws.instructions[kind]; delete S.promptMode[kind]; } }));
  if (ws.length) groups.push({ file: "Honcho prompts", items: ws });
  const instr = Object.entries(S.instr).map(([key, item]) => ({ label: item.label, before: item.before, after: item.text, undo: () => delete S.instr[key] }));
  if (instr.length) groups.push({ file: "Instruction files", items: instr });
  const honcho = Object.entries(S.hEdits).map(([path, value]) => ({ label: path, before: hValue0(path), after: value, undo: () => delete S.hEdits[path] }));
  if (honcho.length) groups.push({ file: "Honcho config (used after a Honcho restart)", items: honcho });
  return groups;
}
const FIELD_NAMES = { brief: "brief", deduction_effort: "deduction effort", induction_effort: "induction effort", deduction_rounds: "deduction rounds", induction_rounds: "induction rounds", backend: "model", enabled: "dreams",
  brief_tokens: "tokens for new conclusions", tool_calls: "tool-call cap", notes: "working notes", notes_tokens: "working notes size", budget: "show budget", write_window: "rounds left to write" };
function fieldName(keys) {
  if (keys[0] === "rerank") return "rerank " + (keys[1] ? (RERANK_NAMES[keys[1]] || keys[1]).toLowerCase() : "(all)");
  return FIELD_NAMES[keys[0]] || keys[0];
}
function plainPath(path) {
  const k = path.split(".");
  if (k[0] === "peers") return "Peer " + k[1] + (k[2] ? ": " + fieldName(k.slice(2)) : "");
  if (k[0] === "pairs") return "Pair " + k[1].replace("/", " → ") + (k[2] ? ": " + fieldName(k.slice(2)) : "");
  if (k[0] === "defaults") return "Defaults: " + fieldName(k.slice(1));
  if (path === "providers.active") return "Dreams: provider";
  if (k[0] === "providers" && k[1] === "backends") return "Provider " + k[2] + ": " + (k[3] === "models" ? "model list" : k[3] === "model" ? "model" : k[3]);
  if (path === "scheduler.poll_seconds") return "Scheduler: check every (seconds)";
  if (path === "scheduler.max_parallel") return "Scheduler: dreams at the same time";
  if (path === "scheduler.dream_type") return "Scheduler: dream type";
  if (path === "scheduler.skip") return "Pairs with dreams disabled";
  if (path === "providers.concurrency") return "Model calls at the same time";
  if (path === "providers.timeout_seconds") return "Time limit per call (seconds)";
  if (path === "mode") return "Who starts dreams";
  return path;
}
function plainValue(path, v) {
  if (path.endsWith(".backend") && typeof v === "string") return shortLabel(v);
  if (path.endsWith(".models") && Array.isArray(v)) return v.length + " models (" + v.slice(-1)[0] + " last)";
  return v;
}
function changeCount() { return changeList().reduce((n, g) => n + g.items.length, 0); }
function discardAll() { S.settings = clone(S.settings0); S.hEdits = {}; S.ws.instructions = {}; S.instr = {}; S.editor = null; S.promptMode = {}; S.routeAllStaged = false; note("Changes discarded."); }

// Writes one settings.json change at once (switches), keeping the edits that wait for Review.
async function writeSettingsNow(mutate, message) {
  const pending = settingsChanges();
  const base = clone(S.settings0);
  mutate(base);
  try {
    await api("/api/settings", { settings: base, mtime_ns: S.mtime, apply: true });
    const fresh = await api("/api/settings");
    S.settings0 = fresh.settings; S.mtime = fresh.mtime_ns;
    S.settings = clone(fresh.settings);
    for (const c of pending) setPath(S.settings, c.path, clone(c.after));
    mutate(S.settings);
    S.notice = message ? { text: message } : "";
  } catch (e) { S.notice = { text: e.message, bad: true }; }
  render();
}

// ---------- data ----------
function indexHoncho(payload) {
  const index = {};
  const walk = (fields) => { for (const f of fields || []) { if (f.fields) walk(f.fields); if (f.entries) for (const e of f.entries) walk(e.fields); if (f.path && !f.fields && !f.entries) index[f.path] = f; } };
  for (const s of payload.sections || []) walk(s.fields);
  return index;
}
function hValue0(path) { const f = S.hIndex[path]; return f ? f.value : undefined; }
function hValue(path) { return path in S.hEdits ? S.hEdits[path] : hValue0(path); }
function hDefault(path) { const f = S.hIndex[path]; return f ? f.default : undefined; }
function hSet(path, value) { if (same(value, hValue0(path))) delete S.hEdits[path]; else S.hEdits[path] = value; }
function wsEnabled(module) { return S.control && S.control.enabled ? S.control.enabled[module] : undefined; }

async function loadAll() {
  const tasks = {
    settings: api("/api/settings"), control: api("/api/control"), honcho: api("/api/honcho-config"), models: api("/api/models"),
    runtime: api("/api/runtime"), peers: api("/api/peers"), status: api("/api/status"), containers: api("/api/containers"),
    history: api("/api/history"), instructions: api("/api/instructions"), prompts: api("/api/prompts"), rerankStats: api("/api/rerank/stats"), rerankWarnings: api("/api/rerank/warnings"), runs: api("/api/runs"), cost: api("/api/cost"),
  };
  const errors = [];
  for (const [name, task] of Object.entries(tasks)) {
    try {
      const d = await task;
      if (name === "settings") { S.settings0 = d.settings; S.settings = clone(d.settings); S.mtime = d.mtime_ns; S.settingsError = d.settings ? null : ((d.errors || []).join("; ") || "settings.json cannot be read"); }

  const v = hValue(path); return v == null ? hDefault(path) : v;
}
// The dream system prompts as the model receives them: Honcho's specialist prompt, the sections switched on, then the custom texts.
function dreamPromptViews(cat, peer, live) {
  const d = S.prompts && S.prompts.dream;
  if (!d) return [h("p", { class: "hint" }, "Stock prompt file not found (config/honcho-prompts.json).")];
  const texts = { dream: dreamTextFor("dream", peer), "peer-card": dreamTextFor("peer-card", peer) };
  if (live != null) texts[cat] = live;
  const on = { brief: !!(hValue("dream.brief_enabled") ?? hDefault("dream.brief_enabled")),
    budget: String(dreamLimit(peer, "budget", "dream.budget_enabled")) === "true",
    notes: (dreamLimit(peer, "notes", "dream.notes_mode") || "off") !== "off" };
  const notesCap = Math.floor((dreamLimit(peer, "notes_tokens", "dream.notes_max_tokens") || 3000) / 2);
  const windowOverride = dreamLimit(peer, "write_window", "dream.write_window_iterations");
  const rounds = { Deduction: dreamLimit(peer, "deduction_rounds", "dream.deduction_max_tool_iterations"), Induction: dreamLimit(peer, "induction_rounds", "dream.induction_max_tool_iterations") };
  return d.specialists.filter((s) => cat === "dream" || s.peer_card).map((s) => {
    let extra = "";
    if (s.extras) {
      const limit = rounds[s.name.split(":")[0]];
      const size = windowOverride != null ? Number(windowOverride) : limit ? Math.floor(limit * 0.15 + 0.5) : null;
      const win = limit && size != null ? Math.min(Math.max(1, limit - 1), Math.max(1, size)) : null;
      for (const k of ["brief", "budget", "notes"]) if (on[k]) extra += "\n\n" + d.sections[k];
      extra = extra.replaceAll("{tool calls}", limit || "{tool calls}").replaceAll("{notes cap}", notesCap)
        .replace("last {write rounds} calls are", win === 1 ? "last call is" : "last " + (win || "{write rounds}") + " calls are");
    }
    const nodes = [s.base + extra];
    const slot = (key) => {
      const text = (texts[key] || "").trim(); if (!text) return;
      const [before, after] = d.custom[key === "dream" ? "dream" : "peer_card"].split(d.slot || "{CUSTOM}");
      nodes.push(before, key === cat ? h("mark", {}, text) : text, after);
    };
    slot("dream"); if (s.peer_card) slot("peer-card");
    return h("details", {}, h("summary", {}, s.name), h("pre", { class: "log prompt" }, ...nodes));
  });
}
const PROMPT_JOBS = { reasoning: "Intake", summary: "Summaries", dialectic: "Questions" };
// Workspace-wide text Honcho uses for every job that has no text of its own.
function sharedText() { return ((S.instructions && S.instructions.database) || {}).shared || ""; }
// The prompt as the model receives it: stock text, custom text in its slot (marked), {placeholders} filled by Honcho.
function promptView(item, custom) {
  const text = custom.trim();
  if (!text) return h("pre", { class: "log prompt" }, item.without.trim());
  const [before, after] = item.with.split((S.prompts && S.prompts.slot) || "{CUSTOM}");
  return h("pre", { class: "log prompt" }, before.trimStart(), h("mark", {}, text), after.trimEnd());
}
function instrPrompts() {
  if (S.instructions && S.instructions.workspace_error) return [h("div", { class: "err" }, "Honcho workspace not readable: " + S.instructions.workspace_error)];
  const db = (S.instructions && S.instructions.database) || {};
  const states = (S.instructions && S.instructions.database_state) || {};
  const shared = sharedText().trim();
  const jobs = (S.prompts && S.prompts.jobs) || {};
  const intro = h("p", { class: "hint" },
    "Honcho always sends its own prompt; it cannot be removed or edited here. What you choose below is extra text that Honcho inserts into that prompt under CUSTOM INSTRUCTIONS. ",
    "It is stored in Honcho's workspace settings (the database), not in a file, and applies to every peer. ",
    shared ? "A shared workspace text is set and is used by every job that has no text of its own." : "No shared workspace text is set.",
    S.prompts && S.prompts.honcho_version ? " Prompts shown are from Honcho " + S.prompts.honcho_version + "; {braces} are filled in by Honcho at each call." : "");
  const boxes = [["reasoning", "Turns new messages into facts about the peer."], ["summary", "Summarises sessions (short every 20 messages, long every 60)."], ["dialectic", "Answers questions about a peer."]].map(([kind, what]) => {
    const state = states[kind];
    const saved = state === "set" ? "mine" : state === "empty" || !shared ? "stock" : "shared";
    const mode = S.promptMode[kind] || saved;
    const staged = S.ws.instructions[kind];
    const area = h("textarea", { rows: 6, placeholder: "Type the extra instructions here" });
    area.value = staged && !staged.unset && staged.text ? staged.text : (state === "set" ? db[kind] || "" : "");
    const custom = () => (mode === "mine" ? area.value : mode === "shared" ? shared : "");
    const views = h("div", {});
    const items = jobs[kind] || [];
    const drawViews = () => views.replaceChildren(...(items.length
      ? items.map((item) => h("details", {}, h("summary", {}, item.name), promptView(item, custom())))
      : [h("p", { class: "hint" }, "Stock prompt file not found (config/honcho-prompts.json).")]));
    drawViews();
    // What this choice writes to Honcho, compared with what is stored now.
    const stage = () => {
      const m = S.promptMode[kind] || saved;
      const text = area.value.trim();
      let want;
      if (m === "mine") want = text ? { state: "set", text } : null;
      else if (m === "shared") want = { state: "missing" };
      else want = { state: shared ? "empty" : state === "empty" ? "empty" : "missing" };
      const same = !want || (want.state === (state || "missing") && (want.state !== "set" || want.text === (db[kind] || "").trim()));
      if (same) delete S.ws.instructions[kind];
      else S.ws.instructions[kind] = want.state === "missing" ? { unset: true } : { text: want.state === "set" ? want.text : "" };
    };
    area.addEventListener("input", () => { stage(); drawViews(); const c = changeCount(); const r = document.getElementById("review-btn"); r.textContent = "Review (" + c + ")"; r.className = c ? "has" : ""; document.getElementById("discard-btn").hidden = !c; });
    const radio = (value, label) => h("label", { style: "margin-right:18px;white-space:nowrap" }, h("input", { type: "radio", name: "m-" + kind, checked: mode === value,
      onchange: () => { S.promptMode[kind] = value; stage(); render(); } }), " " + label);
    const options = [radio("stock", "Honcho's prompt only"), radio("mine", "Honcho's prompt + my text")];
    if (shared) options.splice(1, 0, radio("shared", "Honcho's prompt + shared workspace text"));
    return h("div", { class: "box" }, h("h2", {}, PROMPT_JOBS[kind]), h("div", { class: "in" }, h("p", { class: "hint" }, what),
      h("div", { style: "margin-bottom:6px" }, options),
      mode === "mine" ? area : null,
      h("p", { class: "hint", style: "margin:8px 0 2px" }, "What the model receives (click to open; your text is highlighted):"), views));
  });
  return [intro, ...boxes];
}

// ---------- logs ----------
function pageLogs() {
  const st = S.status || {};
  const rows = (S.containers && S.containers.containers) || [];
  const act = async (action, name) => { try { await api("/api/" + action + "/" + encodeURIComponent(name), {}); note(action + " sent to " + name + "."); setTimeout(loadAll, 4000); } catch (e) { note(e.message, true); } };
  const log = (lines) => { const pre = h("pre", { class: "log" }, (lines || []).join("\n") || "empty"); requestAnimationFrame(() => { pre.scrollTop = pre.scrollHeight; }); return pre; };
  return [h("h1", {}, "Logs"), h("p", { class: "lead" }, "Newest last."),
    h("div", { class: "box" }, h("h2", {}, "Dreams"), h("div", { class: "in" }, log(st.policy_log))),
    h("div", { class: "box" }, h("h2", {}, "Scheduler"), h("div", { class: "in" }, log(st.scheduler_log))),
    h("div", { class: "box" }, h("h2", {}, "Containers"), h("div", { class: "in tw" }, S.containers && S.containers.error ? h("div", { class: "err" }, S.containers.error) : null,
      h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Name"), h("th", {}, "State"), h("th", {}, "Started"), h("th", {}))),
        h("tbody", {}, rows.map((r) => h("tr", {}, h("td", {}, r.name), h("td", { class: r.state === "running" ? "ok" : "bad" }, r.state), h("td", {}, when(r.started_at)),
          h("td", {}, twoStep("Restart", "Click again", () => act("restart", r.name)), " ", r.state === "running" ? twoStep("Stop", "Click again", () => act("stop", r.name)) : h("button", { onclick: () => act("start", r.name) }, "Start")))))))),
  ];
}

// ---------- advanced ----------
const numInput = (o, k, label) => h("label", {}, label, h("input", { type: "number", value: o[k], style: "width:130px", onchange: (e) => { o[k] = Number(e.target.value); render(); } }));
// The scheduler's own settings (settings.json, read at the next check; no restart).
function schedulerBox() {
  const sch = S.settings.scheduler;
  const types = [["omni", "Both passes (deduction, then induction)"], ["card_refresh", "Peer card refresh only"]];
  return h("div", { class: "box" }, h("h2", {}, "Scheduler"), h("div", { class: "in" },
    h("p", { class: "hint" }, "Used when this scheduler starts dreams (above). Unlike the switches above, these wait for Review; the scheduler reads them at its next check, no restart."),
    h("div", { class: "row" },
      h("label", {}, "Dream type", choice(types.map(([value, label]) => ({ value, label })), sch.dream_type || "omni", (v) => { sch.dream_type = v; render(); }, { style: "width:290px" })),
      numInput(sch, "poll_seconds", "Check every (seconds)"), numInput(sch, "max_parallel", "Dreams at the same time"))));
}
// The Honcho release the config fields and defaults on these pages were read from (src/config/honcho-config.schema.json).
function schemaLine() {
  const x = S.honcho || {};
  const commit = x.fork_sha ? (x.fork_version_heading || "fork") + ", commit " + x.fork_sha.slice(0, 7) : x.schema_upstream_sha ? "commit " + x.schema_upstream_sha.slice(0, 7) : "";
  return "Config fields from Honcho " + (x.schema_honcho_version || "unknown") + (commit ? " (" + commit + ")" : "");
}
function pageAdvanced() {
  const prov = S.settings.providers;
  const num = numInput;
  const backups = (S.history && S.history.backups) || [];
  return [h("h1", {}, "Advanced"), h("p", { class: "lead" }, "Rarely changed. Changes wait for Review."),
    h("div", { class: "box" }, h("h2", {}, "Honcho config schema"), h("div", { class: "in" },
      h("p", { class: "hint" }, schemaLine()),
      S.honcho && S.honcho.version_warning ? h("p", { class: "bad" }, S.honcho.version_warning) : null)),
    h("div", { class: "box" }, h("h2", {}, "Model calls"), h("div", { class: "in row" }, num(prov, "concurrency", "Calls at the same time"), num(prov, "timeout_seconds", "Time limit per call (seconds)")),
      h("div", { class: "in" }, h("p", { class: "hint" + (prov.timeout_seconds > 570 ? " bad" : "") }, "The bridge stops a call at 570 seconds at most, below Honcho's own 600-second client timeout, so a higher value runs as 570."))),
    h("div", { class: "box" }, h("h2", {}, "Backups of the dream settings"), h("div", { class: "in tw" },
      h("p", { class: "hint" }, "Every write keeps the previous file in the backups folder: the newest 10, plus everything from the last 7 days."),
      h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Saved"), h("th", {}, "File"), h("th", {}))),
        h("tbody", {}, backups.slice(0, 15).map((b) => h("tr", {}, h("td", {}, when(b.at)), h("td", { class: "mono hint" }, b.name),
          h("td", {}, twoStep("Restore", "Click again", async () => { try { await api("/api/history/restore", { name: b.name, apply: true, mtime_ns: S.mtime }); await loadAll(); note("Restored " + b.name + "."); } catch (e) { note(e.message, true); } })))))))),
  ];
}

// ---------- review and write ----------
function fmt(v) {
  if (v === undefined) return "(not set)";
  if (v === null) return "inherit";
  if (typeof v === "string") return v.length > 160 ? v.slice(0, 160) + "…" : (v || "(empty)");
  return JSON.stringify(v);
}
function openReview() {
  const groups = changeList();
  if (!groups.length) { openModal([h("h2", {}, "No changes waiting")]); return; }
  openModal([h("h2", {}, "Review changes"), h("p", { class: "hint" }, "Before in red, after in green. Undo removes one change."),
    groups.map((g) => h("div", { style: "margin-bottom:12px" }, h("b", {}, g.file),
      h("table", { class: "diff" }, h("tbody", {}, g.items.map((it) => h("tr", {},
        h("td", { style: "font-family:var(--sans)" }, it.label), h("td", { class: "b" }, fmt(it.before)), h("td", { class: "a" }, fmt(it.after)),
        h("td", {}, h("button", { class: "lnk", onclick: () => { it.undo(); render(); openReview(); } }, "Undo")))))))),
    h("button", { class: "pri", id: "write-btn", onclick: writeAll }, "Write")]);
}
async function writeAll() {
  const btn = document.getElementById("write-btn"); if (btn) btn.disabled = true;
  const done = []; let restart = false;
  try {
    // settings.json written: its new mtime and content become the baseline, so a retry after a later failure skips it.
    if (settingsChanges().length) { const r = await api("/api/settings", { settings: S.settings, mtime_ns: S.mtime, apply: true }); S.mtime = r.mtime_ns; S.settings0 = clone(S.settings); done.push("dream settings"); }
    for (const it of Object.values(S.instr)) { await api("/api/instructions", { scope: it.scope, name: it.name, category: it.category, text: it.text, mtime_ns: it.mtime_ns, apply: true }); done.push(it.label); }
    if (Object.keys(S.ws.instructions).length) { await api("/api/workspace", { enabled: {}, instructions: S.ws.instructions, apply: true }); done.push("Honcho prompts"); }
    if (Object.keys(S.hEdits).length) { const values = {}; for (const [p, v] of Object.entries(S.hEdits)) setPath(values, p, v); await api("/api/honcho-config/write", { values, mtime_ns: S.honcho.mtime_ns, before_route_all: !!S.routeAllStaged }); done.push("Honcho config"); restart = true; }
    closeModal(); await loadAll();
    if (restart) S.needRestart = true;
    note("Written: " + done.join(", ") + "." + (restart ? " Honcho's config is used after a restart (Honcho config → Restart Honcho)." : ""));
  } catch (e) { closeModal(); note("Stopped after " + (done.join(", ") || "nothing") + ": " + e.message + ". The rest still waits for Review.", true); }
}
function openModal(children) {
  document.getElementById("modal-panel").replaceChildren(h("button", { class: "lnk x", onclick: closeModal, title: "Close" }, "✕"), ...[children].flat(5));
  document.getElementById("modal").classList.add("show");
}
function closeModal() { document.getElementById("modal").classList.remove("show"); }
document.getElementById("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });

// ---------- theme and navigation ----------
function applyTheme(t) { document.documentElement.dataset.theme = t; document.getElementById("theme-btn").textContent = t === "dark" ? "Light" : "Dark"; }
function toggleTheme() { const n = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; applyTheme(n); try { localStorage.setItem("theme", n); } catch (e) { /* storage blocked */ } }
function fromHash() { const id = location.hash.slice(1); S.page = PAGES.some(([p]) => p === id) ? id : "overview"; S.notice = ""; S.editor = null; render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", fromHash);
window.addEventListener("beforeunload", (e) => { if (changeCount()) { e.preventDefault(); e.returnValue = ""; } });
let theme = "light";
try { theme = localStorage.getItem("theme") || "light"; } catch (e) { /* storage blocked */ }
applyTheme(theme);
S.page = (PAGES.find(([p]) => "#" + p === location.hash) || ["overview"])[0];
loadAll();
setInterval(async () => {
  if (S.page !== "overview" || S.busy) return;
  try { await reloadPart("status", "/api/status"); render(); } catch (e) { /* next poll retries */ }
}, 5000);
</script>
